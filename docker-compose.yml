services:
  vault:
    image: hashicorp/vault:1.17.0
    container_name: demo-vault
    hostname: vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "${VAULT_DEV_TOKEN:-root}"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_LOG_LEVEL: "warn"
      VAULT_ADDR: "http://127.0.0.1:8200"
    cap_add:
      - IPC_LOCK
    networks:
      - demo-net
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  postgres:
    image: postgres:16
    container_name: demo-postgres
    hostname: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: incidents
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - demo-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d incidents"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  demo-web-app:
    build:
      context: ./demo-web-app
    container_name: demo-web-app
    hostname: demo-web-app
    ports:
      - "2222:22"
      - "8080:8080"
    environment:
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: "${VAULT_DEV_TOKEN:-root}"
    depends_on:
      vault:
        condition: service_healthy
    networks:
      - demo-net
    restart: unless-stopped

networks:
  demo-net:
    name: demo-net
    driver: bridge
