[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=1MB
logfile_backups=0
loglevel=warn
pidfile=/tmp/supervisord.pid
user=root

; [unix_http_server], [supervisorctl], and [rpcinterface:supervisor] are
; intentionally omitted here — the base Ubuntu supervisor package's own
; /etc/supervisor/supervisord.conf already defines all three (bound to
; /var/run/supervisor.sock). Duplicating them in this included conf.d file
; let supervisord bind to a different socket than supervisorctl resolved,
; breaking `supervisorctl status` with "no such file".

[program:sshd]
command=/usr/sbin/sshd -D -e
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/sshd.log
stderr_logfile=/var/log/supervisor/sshd.log

[program:demo-web-app]
command=python3 /opt/demo-web-app/app.py
autostart=true
autorestart=true
startsecs=2
startretries=3
stopsignal=TERM
priority=20
stdout_logfile=/var/log/demo-web-app.log
stderr_logfile=/var/log/demo-web-app.log
